---
- name: Issue SSL certificate for containerized AAP
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  tasks:
    - name: Issue Let's Encrypt certificate for AAP
      ansible.builtin.include_role:
        name: issue_cert_containerized
      vars:
        # Required: Your DNS name
        dns_name: "aap-nostromo.demoredhat.com"

        # Optional: Customize ports (defaults shown)
        # nginx_frontend_port: 8444     # Port where nginx will listen with valid cert
        # aap_backend_port: 443         # Port where AAP is currently running

        # Optional: Customize email for Let's Encrypt
        # letsencrypt_email: "your-email@example.com"

        # Optional: Enable MCP Server proxy
        # Set to true if you have an MCP server running and want it proxied with valid SSL
        mcp_proxy_enabled: true
        # mcp_frontend_port: 8449       # Port where nginx will listen for MCP
        # mcp_backend_port: 8448        # Port where MCP server is running

        # Access URLs after running:
        # AAP: https://aap-nostromo.demoredhat.com:8444
        # MCP: https://aap-nostromo.demoredhat.com:8449 (if mcp_proxy_enabled: true)
